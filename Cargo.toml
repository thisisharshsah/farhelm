[workspace]
resolver = "3"
members = [
  "crates/farhelm-agent",
  "crates/farhelm-app",
  "crates/farhelm-cloud",
  "crates/farhelm-crypto",
  "crates/farhelm-domain",
  "crates/farhelm-gateway",
  "crates/farhelm-mcp",
  "crates/farhelm-proto",
  "crates/farhelm-runner",
  "crates/farhelm-sqlite",
  "crates/farhelm-relay",
  "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
farhelm-agent = { path = "crates/farhelm-agent" }
farhelm-app = { path = "crates/farhelm-app" }
farhelm-cloud = { path = "crates/farhelm-cloud" }
farhelm-crypto = { path = "crates/farhelm-crypto" }
farhelm-relay = { path = "crates/farhelm-relay" }
farhelm-domain = { path = "crates/farhelm-domain" }
farhelm-gateway = { path = "crates/farhelm-gateway" }
farhelm-mcp = { path = "crates/farhelm-mcp" }
farhelm-proto = { path = "crates/farhelm-proto" }
farhelm-sqlite = { path = "crates/farhelm-sqlite" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
