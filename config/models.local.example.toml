# Copy to a private operator configuration and set FARHELM_MODELS_CONFIG to its
# absolute path. This file does not start a runtime or download model weights.
version = 1
policy = "local_only"

[routes]
small = "code"
large = "code"
frontier = "code"

# One provider per model served by Farhelm's engine. `farhelm engine add-model`
# gives each model its port (the first is 7846); `farhelm engine status`
# lists them. Any other OpenAI-compatible local server works the same way.
[providers.engine-qwen3-coder-30b]
kind = "openai_compatible"
base_url = "http://127.0.0.1:7846/v1"
data_location = "local"
# api_key_env = "LOCAL_MODEL_API_KEY" # Only if your local server requires it.

[models.qwen3-coder-30b]
provider = "engine-qwen3-coder-30b"
model = "qwen3-coder-30b" # The engine alias, as `farhelm engine add-model --alias` set it.
tools = true # Enable only after testing this model/runtime/template combination.
max_output_tokens = 4096

# Purpose names projects ask for.
[aliases]
code = "qwen3-coder-30b"

# An adapter trained for a model, selected per request as `model:adapter`
# (`model:adapter@vN` pins a version). The engine loads it switched off
# (`farhelm engine add-adapter`); `lora_id` is its position there, which
# `farhelm engine status` lists. Aliases are purpose names projects ask for.
#
# [models.gpt-oss-20b.adapters.fast]
# current = 1
# purpose = "reasoning with short thinking"
# versions = [{ version = 1, lora_id = 0 }]
#
# and, under [aliases] above:
# quick = "gpt-oss-20b:fast"
#
# Which name answers each work mode in the app (Ask, Plan, Agent, Review)
# unless a request names another. A mode left out follows the routes: Agent
# uses `large`, the others `frontier`.
# [modes]
# ask = "quick"
# agent = "code"

# Optional cloud route: deliberately absent from the default configuration.
# To enable, change policy to "cloud_allowed", uncomment this provider/model,
# set OPENROUTER_API_KEY in the runner environment and choose a route alias.
# Replace the placeholder model and sample rates using your provider's prices.
# Zero rates are allowed only when explicitly declared for an authorized free tier.
#
# [providers.openrouter]
# kind = "openrouter"
# base_url = "https://openrouter.ai/api/v1"
# data_location = "cloud"
# api_key_env = "OPENROUTER_API_KEY"
#
# [models.cloud-review]
# provider = "openrouter"
# model = "organization/model-id"
# tools = true
# max_output_tokens = 4096
#
# [models.cloud-review.pricing]
# input_per_mtok = 1.0 # Illustrative dollars per million tokens, not a current quote.
# output_per_mtok = 4.0
# cache_write_per_mtok = 1.0
# cache_read_per_mtok = 1.0
