[package]
name = "relayforge-desktop"
description = "RelayForge desktop: a supervised agent host you can drive from your phone"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The build script reads `frontendDist` out of tauri.conf.json rather than
# repeating the path, so the two cannot drift apart. See build.rs.
serde_json = "1"

[dependencies]
forge-app.workspace = true
forge-sqlite.workspace = true
forge-domain.workspace = true
forge-proto.workspace = true
forge-crypto.workspace = true
forge-gateway.workspace = true
forge-runner = { path = "../../crates/forge-runner" }

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true
