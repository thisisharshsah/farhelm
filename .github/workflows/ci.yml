name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The desktop app needs the webview toolkit to build at all.
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Ledger smoke test
        run: cargo run -p forge-runner -- demo
      # Milestone 2's exit criteria. Printed as well as asserted so a
      # regression shows the number it fell to, not just that it failed.
      - name: Cost-savings benchmarks
        run: |
          cargo test -p forge-gateway --test savings -- --nocapture
          cargo test -p forge-gateway --test compaction_savings -- --nocapture

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      # Includes the cross-language crypto check: the fixture `client-core`
      # opens is generated by `forge-crypto`, so a wire-format drift between the
      # Rust and JS halves fails here rather than on someone's phone.
      - name: Test
        run: pnpm -r test
      - name: Build the web app and service worker
        run: pnpm --filter @relayforge/web build

  watch:
    # The watch's crypto is hand-written — Apple ships no Salsa20 — so it is
    # checked against Rust's and TweetNaCl's output on every commit. Needs macOS
    # for CryptoKit; the tests themselves need no watch.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path mobile/watch
