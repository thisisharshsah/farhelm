[package]
name = "forge-cloud"
description = "RelayForge control plane: accounts, organisations, plans, and the runner/device registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
forge-crypto.workspace = true
forge-mcp.workspace = true
forge-proto.workspace = true

argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

[dev-dependencies]
# The end-to-end test drives the *same* routers the binaries serve, in-process:
# no subprocess to leak, and no second implementation of the handshake to drift.
forge-relay.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.28"
sha2 = "0.10"
base64 = "0.22"

[lints]
workspace = true
