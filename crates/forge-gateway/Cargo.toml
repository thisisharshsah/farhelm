[package]
name = "forge-gateway"
description = "RelayForge cost gateway: the request pipeline every model call passes through"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
forge-app.workspace = true
forge-proto.workspace = true
forge-domain.workspace = true

ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time", "rt"] }

[dev-dependencies]
forge-sqlite.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
